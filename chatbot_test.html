<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="chat-modal" class="fixed bottom-16 right-4 w-96 bg-white rounded-lg shadow-lg flex flex-col h-[60vh]">
        <div class="p-4 bg-gray-800 text-white rounded-t-lg flex justify-between items-center">
            <h2 class="text-lg">PEKKA Assistant</h2>
        </div>
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto">
            <!-- Chat messages will be appended here -->
        </div>
        <div id="loading" class="p-4 text-center hidden">
            <div class="dot-flashing"></div>
        </div>
        <div class="p-4 border-t">
            <div class="flex">
                <input type="text" id="chat-input" class="flex-1 border rounded-l-lg p-2" placeholder="Ask PEKKA a question..." value="What is the best way to wash the gloves?">
                <button id="chat-send" class="bg-blue-500 text-white rounded-r-lg px-4">Send</button>
            </div>
        </div>
    </div>

    <div id="console-logs" class="fixed top-4 left-4 bg-gray-100 p-4 rounded-lg shadow-lg w-1/2 h-1/2 overflow-y-auto">
        <h2 class="text-lg font-bold mb-2">Console Logs</h2>
    </div>

    <script>
        // Add a script to capture console logs and display them on the page
        (function() {
            const consoleLogs = document.getElementById('console-logs');
            const oldLog = console.log;
            const oldError = console.error;

            function logToPage(message, type) {
                const logEntry = document.createElement('div');
                logEntry.classList.add('p-2', 'border-b');
                if (type === 'error') {
                    logEntry.classList.add('text-red-500');
                }
                if (typeof message === 'object') {
                    logEntry.textContent = JSON.stringify(message, null, 2);
                } else {
                    logEntry.textContent = message;
                }
                consoleLogs.appendChild(logEntry);
            }

            console.log = function (message) {
                logToPage(message, 'log');
                oldLog.apply(console, arguments);
            };
            console.error = function (message) {
                logToPage(message, 'error');
                oldError.apply(console, arguments);
            };
            window.onerror = function(message, source, lineno, colno, error) {
                logToPage({
                    message: message,
                    source: source,
                    lineno: lineno,
                    colno: colno,
                    error: error
                }, 'error');
            };
        })();

        const chatModal = document.getElementById('chat-modal');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatMessages = document.getElementById('chat-messages');
        const loading = document.getElementById('loading');

        chatSend.addEventListener('click', () => {
            const query = chatInput.value;
            if (query) {
                appendMessage('user', query);
                processQuery(query);
                chatInput.value = '';
            }
        });

        async function processQuery(query) {
            loading.classList.remove('hidden');
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=GEMINI_API_KEY', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: query
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const botResponse = data.candidates[0].content.parts[0].text;
                appendMessage('bot', botResponse);
            } catch (error) {
                console.error('Error:', error);
                appendMessage('bot', 'Sorry, I am having trouble connecting. Please try again later.');
            } finally {
                loading.classList.add('hidden');
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function appendMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('p-2', 'rounded-lg', 'max-w-xs', 'break-words');

            if (sender === 'user') {
                messageElement.classList.add('bg-blue-500', 'text-white', 'self-end', 'ml-auto');
            } else {
                messageElement.classList.add('bg-gray-200', 'text-black', 'self-start', 'mr-auto');
            }

            messageElement.textContent = message;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Automatically send the message on page load
        window.addEventListener('load', () => {
            chatSend.click();
        });
    </script>
</body>
</html>
